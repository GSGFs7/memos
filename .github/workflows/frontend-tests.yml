name: Frontend Tests

on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal]
    paths:
      - ".github/workflows/frontend-tests.yml"
      - "web/**"
      - ".github/actions/setup-web/**"
      - ".github/workflows/frontend-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup web
        uses: ./.github/actions/setup-web

      - name: Run lint
        working-directory: web
        run: pnpm lint

      - name: Run unit tests
        working-directory: web
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup web
        uses: ./.github/actions/setup-web

      - name: Build frontend
        working-directory: web
        run: pnpm build
