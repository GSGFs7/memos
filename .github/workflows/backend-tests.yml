name: Backend Tests

on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal]
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - ".golangci.yaml"
      - ".github/actions/setup-go/**"
      - ".github/workflows/backend-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: Verify go fix
        run: go fix -diff ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=3m

  tests:
    name: Tests (${{ matrix.test-group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-group: [store, server, internal, other]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run tests
        run: |
          case "${{ matrix.test-group }}" in
            store)
              # Run store tests for all drivers (sqlite, mysql, postgres)
              DRIVER='' go test -v -coverprofile=coverage.out -covermode=atomic ./store/...
              ;;
            server)
              # Includes ./server/test, which boots the real server via
              # server.NewServer and smokes every router it mounts.
              go test -v -race -coverprofile=coverage.out -covermode=atomic ./server/...
              ;;
            internal)
              go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/...
              ;;
            other)
              go test -v -race -coverprofile=coverage.out -covermode=atomic \
                ./cmd/... ./core/... ./markdown/... ./filter/... ./provider/... ./proto/...
              ;;
          esac
        env:
          DRIVER: sqlite
